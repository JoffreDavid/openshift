quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/books2026
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

quarkus.http.port=8070
quarkus.http.host=0.0.0.0

#quarkus.flyway.actions=true
#quarkus.flyway.baseline-at-migrate=true
quarkus.flyway.migrate-at-start=true

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, HEAD

#OpenTelemetry
quarkus.application.name=app-authors
quarkus.datasource.jdbc.telemetry=true

quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n