name: books-app-grupal
services:
  db-server:
    image: postgres:16-alpine
    container_name: db-server
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: books2026
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d books2026"]
      interval: 5s
      timeout: 5s
      retries: 5

  consul:
    image: consul:1.15.4
    container_name: consul
    command: |
      agent -dev
      -ui
      -bind 0.0.0.0
      -client 0.0.0.0
    ports:
      - 8500:8500

  proxy:
    image: traefik:3.7.5
    command: |
      --api.insecure=true
      --api.dashboard=true
      --entryPoints.http.address=":80"
      --entryPoints.traefik.address=":8080"
      --entryPoints.metrics.address=":8082"
      --providers.consulCatalog
      --providers.consulCatalog.endpoint.address=consul:8500
      --providers.consulCatalog.exposedByDefault=false
      --providers.consulCatalog.refreshInterval=5s
      --metrics.prometheus.entryPoint=metrics
    ports:
      - 8888:8080
      - 8080:80
      - 8082:8082

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./configs:/etc/prometheus
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana
    ports:
      - 3000:3000

  authors:
    build:
      context: ../../prog-distribuida/app-authors
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: authors-app
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db-server:5432/books2026
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_HTTP_PORT: 8080
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      db-server:
        condition: service_healthy
      consul:
        condition: service_started

  books:
    build:
      context: ../../prog-distribuida/app-books
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: books-app
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db-server:5432/books2026
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_HTTP_PORT: 8080
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      db-server:
        condition: service_healthy
      consul:
        condition: service_started
      authors:
        condition: service_started

  customers:
    build:
      context: ../../prog-distribuida/app-customers
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: customers-app
    environment:
      SERVER_PORT: 8080
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
    depends_on:
      db-server:
        condition: service_healthy
      consul:
        condition: service_started

  postgresql-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_URI: "db-server:5432/books2026?sslmode=disable"
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: postgres
    ports:
      - 9187:9187

  web-app:
    build:
      context: ../../prog-distribuida/app-web
      dockerfile: Dockerfile
    container_name: web-app
    ports:
      - 5173:80
    depends_on:
      - authors
      - books
      - customers